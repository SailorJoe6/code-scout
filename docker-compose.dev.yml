services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USERNAME: dev
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    volumes:
      - .:/workspaces/code_scout:cached
      - go-mod:/home/dev/go/pkg/mod
      - go-build:/home/dev/.cache/go-build
      - hf-cache:/home/dev/.cache/huggingface
    working_dir: /workspaces/code_scout
    environment:
      CGO_ENABLED: "1"
    stdin_open: true
    tty: true
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  go-mod:
  go-build:
  hf-cache:
